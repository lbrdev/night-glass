# Publishes the live Night Glass demos to GitHub Pages on every push to main.
# The site = the start page site/index.html + assets/ and demo/ from the skill (no copies: taken as is).
name: Pages

on:
  push:
    branches: [main]
    paths: ['skills/night-glass/assets/**', 'skills/night-glass/demo/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          mkdir -p _site
          cp -r skills/night-glass/assets skills/night-glass/demo _site/
          cp site/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
